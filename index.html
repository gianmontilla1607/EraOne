                    <p><strong>No fue una explosión en el espacio, sino una explosión <em>del</em> espacio.</strong> Hace 13.800 millones de años, todo lo que hoy vemos —galaxias, estrellas, planetas y el espacio vacío entre ellos— estaba comprimido en un punto de densidad infinita, más pequeño que un átomo. En una trillonésima de segundo, el universo experimentó una "inflación" brutal, expandiéndose más rápido que la velocidad de la luz.</p>
                    
                    <p>Durante los primeros minutos, el cosmos era un reactor nuclear titánico. Se formaron los primeros núcleos de hidrógeno y helio, pero el calor era tan intenso que la luz no podía viajar; los fotones estaban atrapados en una sopa densa de plasma. El universo era opaco, como una niebla brillante e infinita.</p>
                    
                    <p>Tuvieron que pasar <strong>380.000 años</strong> para que el universo se enfriara lo suficiente (a unos 3.000 °C) para que los electrones se unieran a los núcleos y formaran los primeros átomos neutros. En ese instante, la niebla se disipó y la luz pudo viajar libremente por primera vez. Esa luz primigenia todavía viaja hoy: es el Fondo Cósmico de Microondas, una "fotografía" del universo bebé.</p>
                    
                    <p class="text-amber-400 italic">Curiosidad: Cuando sintonizas una radio antigua o ves estática en una televisión de tubo analógica, aproximadamente el 1% de ese "ruido" es radiación remanente del Big Bang interactuando con tu antena.</p>
                `,

                fullContent: `
                    <p>Nuestro sistema solar nació de las cenizas de estrellas muertas. Una nube molecular gigante colapsó (posiblemente empujada por la onda expansiva de una supernova cercana), formando el Sol en el centro. El resto del material formó un disco giratorio de polvo y gas: el disco protoplanetario.</p>
                    
                    <p>En este caos, la gravedad hizo su trabajo. Pequeños granos de polvo chocaron y se pegaron, formando rocas, luego asteroides y finalmente protoplanetas. La Tierra temprana no era el paraíso azul que conocemos; era una bola de magma fundido, bombardeada incesantemente por restos cósmicos.</p>
                    
                    <p>El evento más crítico ocurrió poco después: un protoplaneta del tamaño de Marte, llamado <strong>Theia</strong>, chocó contra la Tierra joven. El impacto fue tan violento que fundió ambos mundos y expulsó una enorme cantidad de escombros a la órbita. Esos escombros se fusionaron para formar nuestra <strong>Luna</strong>.</p>
                    
                    <p><strong>Consecuencia clave:</strong> Sin este impacto violento, la Tierra no tendría una luna tan grande. La Luna estabiliza la inclinación de nuestro eje, lo que nos da estaciones predecibles y un clima estable durante millones de años. Sin la Luna, el clima de la Tierra sería caótico, dificultando enormemente la evolución de la vida compleja.</p>

                shortDesc: "La materia inerte cobra vida.",
                fullContent: `
                    <p>En algún lugar de los océanos primitivos, probablemente en fuentes hidrotermales profundas, ocurrió el milagro de la química: la materia inerte comenzó a comportarse como vida. Moléculas complejas (quizás ARN al principio) aprendieron a hacer copias de sí mismas. Estas primeras entidades se rodearon de membranas de grasa para protegerse del exterior, creando las primeras células procariotas.</p>
                    
                    <p>Durante mil millones de años, la vida fue invisible y aburrida. Pero entonces, un grupo de bacterias (las cianobacterias) descubrió una tecnología revolucionaria: la <strong>fotosíntesis</strong>. Aprendieron a usar la luz solar para romper moléculas de agua y obtener energía, liberando un gas residual tóxico para la mayoría de la vida de entonces: el oxígeno.</p>
                    
                    <p><strong>El Gran Evento de Oxidación:</strong> Este "residuo" cambió el planeta para siempre. El oxígeno oxidó el hierro de los océanos (volviéndolos rojos por un tiempo) y luego llenó la atmósfera, creando la capa de ozono. Aunque causó una extinción masiva de microbios anaeróbicos, el oxígeno es un combustible de alto octanaje metabólico. Su presencia permitió, eones después, que existieran animales grandes y energéticamente costosos, como nosotros.</p>

            {

                icon: "brain",
                shortDesc: "El nacimiento del lenguaje simbólico.",
                fullContent: `
                    <p>Hace 70.000 años, el <em>Homo sapiens</em> era un animal insignificante que vivía en rincones de África. No éramos más fuertes que los Neandertales ni más rápidos que los leones. Sin embargo, algo cambió en la estructura de nuestro cerebro: desarrollamos el <strong>lenguaje ficticio</strong>.</p>
                    
                    <p>Muchos animales tienen lenguaje (los monos pueden gritar "¡Cuidado, un águila!"), pero solo los humanos pueden comunicar cosas que no existen físicamente: "El espíritu del río está enojado" o "Esta concha vale por tres pescados". Esta capacidad de crear y creer en <strong>ficciones compartidas</strong> (mitos, religiones, leyes, dinero, naciones) es el superpoder de nuestra especie.</p>
                    
                    <p><strong>¿Por qué es importante?</strong> La ficción permite la cooperación flexible a gran escala. Un chimpancé no puede cooperar con 500 extraños porque necesita conocerlos personalmente. Los humanos pueden cooperar con millones de extraños si todos creen en la misma historia (por ejemplo, el valor del dólar o los derechos humanos). Esta revolución nos permitió organizarnos, crear estrategias complejas y, finalmente, dominar el planeta, desplazando a todas las demás especies humanas.</p>
                `,
                imagePlaceholder: "bg-gradient-to-br from-yellow-600 to-yellow-900"
            },
            {
                id: 5,

                title: "La Imprenta",
                category: "invention",
                icon: "book-open",
                shortDesc: "Democratizando el conocimiento.",
                fullContent: `
                    <p>Antes de 1440, los libros eran objetos de lujo, copiados a mano por monjes en un proceso lento y propenso a errores. Un solo libro podía costar lo mismo que una granja. El conocimiento estaba centralizado y controlado. Johannes Gutenberg, un orfebre alemán, combinó la prensa de vino con tipos móviles de metal duradero y tinta a base de aceite, creando la máquina de copiar definitiva.</p>
                    
                    <p>El impacto fue explosivo. En 50 años, había más libros en Europa que los producidos en los mil años anteriores. La información dejó de ser escasa. Esto tuvo consecuencias sísmicas:</p>
                    <ul class="list-disc pl-5 space-y-2 mb-4">
                        <li><strong>Reforma Religiosa:</strong> Martín Lutero pudo difundir sus críticas a la Iglesia Católica viralmente. La Biblia se tradujo a lenguas locales, permitiendo que la gente interpretara la fe sin intermediarios.</li>
                        <li><strong>Revolución Científica:</strong> Los científicos pudieron publicar sus hallazgos de forma exacta y estandarizada. Antes, los datos se corrompían al copiarse; con la imprenta, Copérnico y Newton pudieron "dialogar" a través del tiempo con datos fiables.</li>
                    </ul>
                    <p><strong>Conexión futura:</strong> La imprenta estandarizó el almacenamiento de información. Fue el primer paso hacia la digitalización: convertir el pensamiento humano en datos reproducibles mecánicamente, el ancestro directo de los paquetes de datos de internet.</p>
                `,
                imagePlaceholder: "bg-gradient-to-br from-amber-800 to-gray-800"
            },
            {
                id: 6,
                year: "1969 d.C.",
                title: "ARPANET (Internet)",
                category: "invention",
                icon: "zap",
                shortDesc: "El sistema nervioso global.",
                fullContent: `
                    <p>En plena Guerra Fría, el Departamento de Defensa de EE.UU. necesitaba una red de comunicaciones que pudiera sobrevivir a un ataque nuclear. La solución no fue construir un búnker central más fuerte, sino <strong>descentralizar</strong>. Crearon una red donde la información se rompía en pequeños "paquetes" que podían tomar cualquier ruta disponible para llegar a su destino. Si un nodo era destruido, los datos fluían por otro camino.</p>
                    
                    <p>El 29 de octubre de 1969, se envió el primer mensaje entre dos computadoras (de UCLA a Stanford). Intentaron escribir "LOGIN". El sistema se colgó después de la letra "O". El primer mensaje de internet fue, poéticamente, "LO".</p>
                    
                    <p>Lo que nació como herramienta militar y académica se transformó en el <strong>sistema nervioso de la humanidad</strong>. Por primera vez en la historia, la distancia geográfica dejó de ser una barrera para la comunicación instantánea. Esto ha acelerado la innovación (GitHub), cambiado la economía (e-commerce) y reestructurado nuestras relaciones sociales. Internet ha convertido a la especie humana en un superorganismo conectado, para bien y para mal.</p>
                `,

            },

                year: "2020s",

                shortDesc: "La inteligencia se vuelve mercancía.",
                fullContent: `
                    <p>Durante décadas, pensamos que la automatización reemplazaría primero el trabajo físico (robots en fábricas) y que la creatividad sería el último bastión humano. Nos equivocamos. La Inteligencia Artificial Generativa (LLMs como GPT, modelos de difusión) demostró que la creatividad, el lenguaje y el razonamiento lógico también pueden ser modelados matemáticamente.</p>
                    
                    <p>Estos modelos no "piensan" como nosotros, pero procesan patrones lingüísticos y visuales a una escala incomprensible para un cerebro biológico. Hemos logrado desacoplar la inteligencia de la conciencia biológica. Ahora, la inteligencia es un servicio público (como la electricidad) que se puede generar a demanda.</p>
                    
                    <p><strong>El Dilema:</strong> Estamos ante una herramienta de doble filo. Puede acelerar la ciencia médica, resolver el cambio climático y personalizar la educación para cada niño del planeta. Pero también amenaza con inundar el mundo de desinformación, desplazar empleos cognitivos y, en escenarios especulativos, superar nuestro control. Es el invento más poderoso desde el fuego, y al igual que el fuego, puede calentarnos o quemar nuestra casa.</p>
                `,
                imagePlaceholder: "bg-gradient-to-r from-purple-500 via-pink-500 to-red-500"

        const universeArticles = [
            {
                id: "u1",
                title: "¿Qué pasó en los primeros 380.000 años?",
                desc: "El universo era una sopa de plasma opaco. La luz estaba atrapada.",
                fullContent: `
                    <p>Imagina un universo sin oscuridad. En sus inicios, el cosmos no era el vasto espacio negro que vemos hoy, sino una niebla cegadora y ardiente. Durante los primeros 380.000 años después del Big Bang, la temperatura era tan extrema que los átomos no podían formarse. Los electrones vagaban libres en un estado llamado <strong>plasma</strong>.</p>
                    
                    <p>En este entorno, los fotones (partículas de luz) no podían viajar ni un centímetro sin chocar contra un electrón libre. La luz estaba atrapada en un juego de pinball cósmico infinito. El universo era opaco, similar al interior de una nube densa o del sol.</p>
                    
                    <p>La liberación llegó con la <strong>Recombinación</strong>. A medida que el universo se expandía, se enfriaba. Cuando la temperatura bajó a 3.000 Kelvin (algo más frío que la superficie del sol), los protones finalmente pudieron capturar a los electrones para formar hidrógeno neutro. De repente, el "tráfico" desapareció. Los fotones quedaron libres para viajar en línea recta por el espacio. Esa primera luz, ahora estirada por la expansión del universo hacia el espectro de microondas, es lo que detectamos hoy como el eco del Big Bang.</p>
                    
                    <p class="border-l-4 border-indigo-500 pl-4 text-indigo-300 italic">Dato clave: Esta luz nos muestra un mapa de las densidades del universo temprano. Las zonas un poco más densas de esa sopa primordial eventualmente colapsaron por gravedad para formar las galaxias que habitamos hoy.</p>
                `,
                icon: "telescope",
                tag: "Cosmología",
                imagePlaceholder: "bg-gradient-to-br from-indigo-900 to-purple-800"
            },
            {
                id: "u2",
                title: "Fábricas de estrellas",
                desc: "Casi todos los átomos de tu cuerpo fueron forjados en una estrella.",
                fullContent: `
                    <p>El Big Bang fue un evento poco creativo químicamente: solo produjo Hidrógeno (75%), Helio (25%) y trazas de Litio. No había carbono para la vida, ni oxígeno para el agua, ni hierro para la sangre, ni silicio para las computadoras. El universo era gaseoso y estéril.</p>
                    
                    <p>La magia ocurrió dentro de las primeras estrellas. Una estrella es esencialmente un reactor de fusión nuclear gigante que lucha contra su propia gravedad. En sus núcleos, la presión aplasta átomos simples para crear otros más complejos, liberando energía en el proceso (luz solar). Durante millones de años, las estrellas "cocinan" elementos: helio en carbono, carbono en neón, neón en oxígeno, hasta llegar al hierro.</p>
                    
                    <p>Pero el hierro es el final del camino. Fusionar hierro no libera energía, sino que la consume. Cuando una estrella masiva acumula demasiado hierro en su núcleo, el reactor se apaga repentinamente. La gravedad gana, la estrella colapsa en una fracción de segundo y luego rebota en una explosión cataclísmica: una <strong>supernova</strong>.</p>
                    
                    <p>En esa explosión final se forjan los elementos más pesados (oro, uranio) y, lo más importante, se dispersan todos los elementos cocinados por el cosmos. Nuestro sistema solar se formó a partir de una nube enriquecida por estas explosiones previas. Literalmente, los átomos de tu mano izquierda probablemente vinieron de una estrella diferente a los de tu mano derecha.</p>
                `,
                icon: "atom",
                tag: "Astrofísica",
                imagePlaceholder: "bg-gradient-to-br from-yellow-500 to-red-600"
            },
            {
                id: "u3",
                title: "El destino final: Frío o Fuego",
                desc: "¿Se expandirá el universo para siempre o colapsará?",
                fullContent: `
                    <p>Durante el siglo XX, los cosmólogos creían que había dos finales posibles para el universo, dependiendo de cuánta materia hubiera. Si había mucha materia, la gravedad eventualmente frenaría la expansión y haría que todo colapsara hacia atrás (el <strong>Big Crunch</strong> o Gran Implosión). Si había poca materia, la expansión continuaría para siempre, pero cada vez más lenta.</p>

        // 8. EXPLORE
        function renderExplore() {

        // --- MODAL LOGIC ---
        function openModalById(id, type) {
            let item;
            if(type === 'timeline') item = timelineData.find(d => d.id == id);
            else if(type === 'universe') item = universeArticles.find(d => d.id == id);
            else if(type === 'life') item = lifeArticles.find(d => d.id == id);
            else if(type === 'humanity') item = humanityArticles.find(d => d.id == id);
            else if(type === 'connections') item = connectionArticles.find(d => d.id == id); // Added connections type
            
            if(item) openModal(item);
        }

        function openModal(item) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            
            // Populate Data
            document.getElementById('modal-image').className = `h-48 md:h-64 w-full bg-slate-800 bg-cover bg-center ${item.imagePlaceholder || 'bg-slate-800'}`;
            
            let metaHTML = '';
            if(item.year) {
                metaHTML = `<i data-lucide="${item.icon}"></i> <span>${item.year}</span>`;
            } else if (item.tag) {
                metaHTML = `<i data-lucide="${item.icon}"></i> <span>${item.tag}</span>`;
            } else if (item.title) {
                // Fallback para conexiones u otros que no tengan tag/year
                 metaHTML = `<i data-lucide="share-2"></i> <span>Conexión</span>`;
            }

            document.getElementById('modal-meta').innerHTML = metaHTML;
            document.getElementById('modal-title').innerText = item.title;
            // IMPORTANTE: Cambiado a innerHTML para soportar el formato enriquecido de los artículos
            document.getElementById('modal-body').innerHTML = item.fullContent;

            // Show
            overlay.classList.remove('hidden');
            // Small delay to allow transition
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);

            // Re-render icons inside modal
            lucide.createIcons();
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');

            overlay.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');

            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        }
    </script>
