        u1:[['La luz más antigua','Esa primera luz liberada hace unos 13.800 millones de años hoy llega como microondas a unos 2,7 K. En 1965, Arno Penzias y Robert Wilson la detectaron por casualidad con una antena de radio. Satélites como COBE, WMAP y Planck han cartografiado sus diminutas variaciones de temperatura, de una parte entre cien mil.'],['Semillas de las galaxias','Esas variaciones son las huellas de las primeras diferencias de densidad. La gravedad las amplificó durante cientos de millones de años hasta formar estrellas, galaxias y la red cósmica. Su patrón permite medir la edad, la geometría y la composición del universo.']],

        h1:[['Dominar el fuego','El uso controlado del fuego, hace al menos cientos de miles de años, permitió cocinar, lo que facilita digerir y obtener más energía del alimento. También protegía del frío y de los depredadores, y alargaba el día alrededor de una hoguera.'],['El lenguaje y la cultura','El lenguaje permitió transmitir conocimiento más allá de la experiencia individual, coordinar grupos y construir historias compartidas. Fue clave para acumular cultura: cada generación empieza donde terminó la anterior.']],

        function setupSolarSystemSimulation() {
            const canvas = document.getElementById('solar-canvas');
            if (!canvas) return;
            if (solarAnimationFrame) cancelAnimationFrame(solarAnimationFrame);
            const speed = document.getElementById('sim-speed');
            const distance = document.getElementById('sim-distance');
            const planet = document.getElementById('sim-planet');
            speed.addEventListener('input', () => {
                solarSpeed = Number(speed.value);
                document.getElementById('sim-speed-value').textContent = solarSpeed.toFixed(1) + '×';
                document.getElementById('sim-speed-readout').textContent = solarSpeed.toFixed(1) + '×';
            });
            distance.addEventListener('input', () => {
                solarDistance = Number(distance.value);
                document.getElementById('sim-distance-value').textContent = solarDistance.toFixed(2) + '×';
            });
            planet.addEventListener('change', () => {
                solarSelected = Number(planet.value);
                updateSolarPlanetInfo();
            });
            solarLastTime = 0;
            solarAnimationFrame = requestAnimationFrame(drawSolarSystem);
            updateSolarPlanetInfo();
        }

        function updateSolarPlanetInfo() {

        function drawSolarSystem(timestamp) {
            const canvas = document.getElementById('solar-canvas');
            if (!canvas) { solarAnimationFrame = null; return; }
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const width = Math.max(300, rect.width);
            const height = Math.max(330, rect.height);
            if (canvas.width !== Math.floor(width * dpr) || canvas.height !== Math.floor(height * dpr)) {
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
            }
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, width, height);
            const dt = solarLastTime ? Math.min((timestamp - solarLastTime) / 1000, 0.05) : 0;
            solarLastTime = timestamp;
            if (!solarPaused) solarElapsed += dt * solarSpeed;
            ctx.fillStyle = '#050816'; ctx.fillRect(0, 0, width, height);

            // Star field is deterministic so it does not flicker between frames.
            for (let i = 0; i < 115; i++) {
                const x = (i * 97.13 + 19) % width;
                const y = (i * 53.71 + 11) % height;
                const r = (i % 5 === 0) ? 1.2 : 0.55;
                ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = i % 7 === 0 ? 'rgba(125,211,252,.8)' : 'rgba(226,232,240,.55)'; ctx.fill();
            }

            const cx = width * 0.5, cy = height * 0.5;
            const fit = Math.min(width, height) / 500;
            const base = fit * (solarView === '3d' ? 1.0 : 1.12);
            const tilt = solarView === '3d' ? 0.57 : 1;
            // Soft glow around the Sun.
            const glow = ctx.createRadialGradient(cx, cy, 2, cx, cy, 45 * base);
            glow.addColorStop(0, 'rgba(251,191,36,.34)'); glow.addColorStop(1, 'rgba(251,191,36,0)');
            ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, 45 * base, 0, Math.PI * 2); ctx.fill();

            solarPlanets.forEach((p, i) => {
                const radius = p.orbit * base * solarDistance;
                ctx.beginPath(); ctx.ellipse(cx, cy, radius, radius * tilt, 0, 0, Math.PI * 2);
                ctx.strokeStyle = i === solarSelected ? 'rgba(103,232,249,.48)' : 'rgba(148,163,184,.20)';
                ctx.lineWidth = i === solarSelected ? 1.5 : 1; ctx.stroke();
            });

            // Sun.
            const sunGrad = ctx.createRadialGradient(cx - 5, cy - 5, 1, cx, cy, 17 * base);
            sunGrad.addColorStop(0, '#fff7c2'); sunGrad.addColorStop(.5, '#fbbf24'); sunGrad.addColorStop(1, '#ea580c');
            ctx.beginPath(); ctx.arc(cx, cy, 11 * base, 0, Math.PI * 2); ctx.fillStyle = sunGrad; ctx.fill();
            ctx.fillStyle = 'rgba(253,230,138,.85)'; ctx.font = '12px Inter, sans-serif'; ctx.fillText('Sol', cx + 14 * base, cy - 12 * base);

            solarPlanets.forEach((p, i) => {
                const angle = solarElapsed * 0.42 / Math.sqrt(p.period) + i * 0.7;
                const r = p.orbit * base * solarDistance;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r * tilt;
                const pr = Math.max(2.2, p.radius * base * (solarView === '3d' ? 1.1 : 1));
                if (i === solarSelected) {
                    ctx.beginPath(); ctx.arc(x, y, pr + 7, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(103,232,249,.75)'; ctx.lineWidth = 1.5; ctx.stroke();
                }
                ctx.beginPath(); ctx.arc(x, y, pr, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.fill();
                if (i === 5) {
                    ctx.beginPath(); ctx.ellipse(x, y, pr * 1.9, pr * .75, -0.25, 0, Math.PI * 2);
                    ctx.strokeStyle = '#d6c59d'; ctx.lineWidth = Math.max(1, 2 * base); ctx.stroke();
                }
                if (i === solarSelected) {
                    ctx.font = 'bold 12px Inter, sans-serif'; ctx.fillStyle = '#e0f2fe';
                    ctx.fillText(p.name, x + pr + 7, y - pr - 5);
                }
            });
            if (solarView === '3d') {
                ctx.fillStyle = 'rgba(148,163,184,.75)'; ctx.font = '11px Inter, sans-serif';
                ctx.fillText('Perspectiva inclinada (no es una simulación gravitatoria 3D)', 12, height - 14);
            }
            solarAnimationFrame = requestAnimationFrame(drawSolarSystem);
        }

        const IMGS=['https://images.pexels.com/photos/37824750/pexels-photo-37824750.png?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/13344256/pexels-photo-13344256.jpeg?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/32961169/pexels-photo-32961169.png?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/7736151/pexels-photo-7736151.jpeg?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/10144162/pexels-photo-10144162.jpeg?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/34012639/pexels-photo-34012639.jpeg?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/17621401/pexels-photo-17621401.jpeg?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/37474090/pexels-photo-37474090.jpeg?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/8237959/pexels-photo-8237959.jpeg?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/17505900/pexels-photo-17505900.jpeg?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/9408779/pexels-photo-9408779.jpeg?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/26607689/pexels-photo-26607689.png?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/17662495/pexels-photo-17662495.jpeg?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/38039464/pexels-photo-38039464.png?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/38687094/pexels-photo-38687094.png?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/38207820/pexels-photo-38207820.png?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/7736065/pexels-photo-7736065.jpeg?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/38039151/pexels-photo-38039151.png?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/38600715/pexels-photo-38600715.jpeg?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/35845484/pexels-photo-35845484.jpeg?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/35845331/pexels-photo-35845331.jpeg?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/18827608/pexels-photo-18827608.jpeg?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/18814283/pexels-photo-18814283.jpeg?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/18212022/pexels-photo-18212022.jpeg?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/18211969/pexels-photo-18211969.jpeg?auto=compress&cs=tinysrgb&w=1200','https://images.pexels.com/photos/12491775/pexels-photo-12491775.jpeg?auto=compress&cs=tinysrgb&w=1200'];
        const imgFor=k=>{let h=0;for(const ch of String(k))h=(h*31+ch.charCodeAt(0))%9973;return IMGS[h%IMGS.length];};
        function decorateCards(){document.querySelectorAll('[onclick^="openModalById"]').forEach(el=>{if(el.dataset.img||el.querySelector('img'))return;el.dataset.img=1;const m=el.getAttribute('onclick').match(/'([^']+)'/);const im=document.createElement('img');im.src=imgFor(m[1]);im.loading='lazy';im.alt='';im.className='w-full h-40 object-cover rounded-lg mb-4 opacity-90 group-hover:opacity-100 transition-opacity';im.onerror=()=>im.remove();el.prepend(im);});}
        // ===== SIMULACIONES 02-08 (Fases 1 y 2) =====
        const TAU=Math.PI*2, rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}, clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
        const bgStars=(c,w,h)=>{c.fillStyle='#050816';c.fillRect(0,0,w,h);for(let i=0;i<90;i++){c.fillStyle=`rgba(226,232,240,${.25+rnd(i+7)*.5})`;c.beginPath();c.arc(rnd(i)*w,rnd(i+300)*h,rnd(i+9)>.9?1.2:.6,0,TAU);c.fill();}};
        const tempColor=T=>T<3500?'#ff6a3d':T<4500?'#ff9a4d':T<5500?'#ffc66d':T<6500?'#fff0c8':T<8500?'#e8f0ff':T<15000?'#b8d0ff':'#9db8ff';
        const txt=(c,s,x,y,col,sz,al)=>{c.fillStyle=col||'#cbd5e1';c.font=(sz||12)+'px Inter, sans-serif';c.textAlign=al||'left';c.fillText(s,x,y);};
        const glow=(c,x,y,r,rgb,a)=>{const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${rgb},${a})`);g.addColorStop(1,`rgba(${rgb},0)`);c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();};
        const circ=(c,x,y,r,col)=>{c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();};
        const fnum=r=>r>=1e4?r.toExponential(1).replace('e+','×10^'):r>=10?r.toFixed(0):r.toFixed(1);

        // --- Luna ---
        const moonName=d=>d<1||d>28.5?'Luna nueva':d<6.4?'Creciente':d<8.4?'Cuarto creciente':d<13.4?'Gibosa creciente':d<16.1?'Luna llena':d<21?'Gibosa menguante':d<23?'Cuarto menguante':'Menguante';
        const moonCalc=v=>{const th=v.day/29.5*TAU,lat=v.inc*Math.sin(th-v.node*Math.PI/180),ok=Math.abs(lat)<1.2;return{th,lat,ecl:ok&&Math.min(th,TAU-th)<.12?'solar':ok&&Math.abs(th-Math.PI)<.12?'lunar':''};};
        const moonDisc=(c,x,y,r,th)=>{c.save();c.translate(x,y);const wan=th>Math.PI,a=wan?TAU-th:th,k=Math.cos(a);if(wan)c.scale(-1,1);circ(c,0,0,r,'#1e293b');c.fillStyle='#e2e8f0';c.beginPath();c.arc(0,0,r,-Math.PI/2,Math.PI/2);c.ellipse(0,0,Math.max(.01,r*Math.abs(k)),r,0,Math.PI/2,-Math.PI/2,k>0);c.fill();c.restore();};

        // --- Laboratorio de planetas --- [masa M⊕, radio km, gravedad m/s², temp °C, color]
        const LAB={'Mercurio':[.055,2440,3.70,167,'#b8b2a8'],'Venus':[.815,6052,8.87,464,'#e8c58c'],'Tierra':[1,6371,9.81,15,'#4da6ff'],'Luna':[.0123,1737,1.62,-20,'#cbd5e1'],'Marte':[.107,3390,3.71,-65,'#ef795b'],'Júpiter':[317.8,69911,24.79,-110,'#e6b78a'],'Saturno':[95.2,58232,10.44,-140,'#e9d5a4'],'Urano':[14.5,25362,8.69,-195,'#9be5e9'],'Neptuno':[17.1,24622,11.15,-200,'#5577ff']};

        const STN=[['Enana roja (secuencia principal)','Agotando el hidrógeno','Se apaga lentamente','Enana blanca de helio'],['Secuencia principal','Gigante roja','Nebulosa planetaria','Enana blanca'],['Secuencia principal','Supergigante roja','Supernova','Estrella de neutrones'],['Secuencia principal','Supergigante roja','Supernova','Agujero negro']];
        const yrs=x=>x>=1e12?(x/1e12).toFixed(1)+' billones de años':x>=1e9?(x/1e9).toFixed(1)+' mil millones de años':x>=1e6?(x/1e6).toFixed(1)+' millones de años':Math.round(x)+' años';

        const ovl=(d,r)=>{if(d>=1+r)return 0;if(d<=Math.abs(1-r))return Math.PI*Math.min(1,r*r);return Math.acos((d*d+1-r*r)/(2*d))+r*r*Math.acos((d*d+r*r-1)/(2*d*r))-.5*Math.sqrt((-d+1+r)*(d+1-r)*(d-1+r)*(d+1+r));};

        supernova:{phase:3,n:10,icon:'zap',title:'Explosión de una supernova',diff:'Media–alta',

        blackhole:{phase:3,n:11,icon:'circle-dot',title:'Laboratorio de agujeros negros',diff:'Alta',

          outs:v=>{const k=bhCalc(v);return[kmF(k.rs),kmF(5.2*k.rs),(k.ri/2).toFixed(2)+' rs',Math.round(k.dil*100)+' % del tiempo lejano'];},

          draw(c,w,h,t,v){const k=bhCalc(v);c.fillStyle='#02030a';c.fillRect(0,0,w,h);const cx=w/2,cy=h/2,Rs=Math.min(w,h)*.07,sh=2.6*Rs,rin=Math.max(1.3*Rs,k.ri/2*Rs),rout=sh*3.4,inc=v.incl*Math.PI/180,ci=Math.cos(inc),si=Math.sin(inc),P=[];

            c.setLineDash([3,4]);c.strokeStyle='rgba(148,163,184,.5)';c.lineWidth=1;c.beginPath();c.arc(cx,cy,Rs,0,TAU);c.stroke();c.setLineDash([]);
            txt(c,'Horizonte de sucesos (rs)',cx+Rs+6,cy+4,'#94a3b8',10);txt(c,'Sombra ≈ 2,6 rs',cx,cy-sh-8,'#94a3b8',10,'center');txt(c,'Representación artística · escala relativa',12,h-12,'#64748b',11);}},
        collision:{phase:3,n:12,icon:'waves',title:'Colisión de objetos cósmicos',diff:'Alta',

        orbital:{phase:4,n:13,icon:'orbit',title:'Mecánica orbital',diff:'Media–alta',

          tips:['A 400 km, 7,67 km/s da una órbita casi circular.','Súbela a 9 km/s: la órbita se vuelve elíptica.','Pasa de 10,8 km/s a 400 km: escapa de la Tierra.'],

          outs:v=>{const k=orbCalc(v),P=k.e<1&&k.rp>=k.Re?2*Math.PI*Math.sqrt(Math.pow(k.a,3)/k.MU):0;return[k.type,P?(P<7200?Math.round(P/60)+' min':(P/3600).toFixed(1)+' h'):'—',k.vc.toFixed(2)+' km/s',k.ve.toFixed(2)+' km/s'];},
          explain:v=>{const k=orbCalc(v);return `Trayectoria: ${k.type.toLowerCase()}. Excentricidad e = ${k.e.toFixed(2)}. Perigeo a ${Math.round(k.rp-k.Re).toLocaleString('es')} km de altitud${k.e<1?`; apogeo a ${Math.round(k.p/(1-k.e)-k.Re).toLocaleString('es')} km`:''}.`;},
          draw(c,w,h,t,v){bgStars(c,w,h);const k=orbCalc(v),mk=()=>({x:k.r0,y:0,vx:0,vy:v.v,lt:t,tr:[],st:'',end:0}),key=v.h+'|'+v.v;
            if(!G.o||G.key!==key||t<G.o.lt||(G.o.end&&t-G.o.end>2.5)){G.key=key;G.o=mk();}const o=G.o;let sim=(t-o.lt)*700;o.lt=t;

            c.strokeStyle='rgba(148,163,184,.35)';c.lineWidth=1;c.setLineDash([4,4]);c.beginPath();const th0=k.e>1e-6?Math.acos(clamp((k.p/k.r0-1)/k.e,-1,1)):0,lim=k.e<1?Math.PI:Math.acos(-1/k.e)*.97;let f=true;
            for(let i=0;i<=240;i++){const th=-lim+2*lim*i/240,r=k.p/(1+k.e*Math.cos(th));if(r<0||r>Rv*3)continue;const a=th-th0;const px=X(r*Math.cos(a)),py=Y(r*Math.sin(a));f?c.moveTo(px,py):c.lineTo(px,py);f=false;}c.stroke();c.setLineDash([]);

        expansion:{phase:4,n:14,icon:'maximize',title:'Expansión del universo',diff:'Alta',

          explain:v=>{const k=cosCalc(v),q=v.om/2-v.ol;return `${isFinite(k.amax)&&k.amax<10?'Con estos parámetros la expansión se detiene y el universo recolapsaría. ':q<0?'La energía oscura domina: la expansión se acelera. ':'La gravedad de la materia domina: la expansión se frena. '}Las galaxias no se mueven por el espacio: es el espacio entre ellas el que crece. La velocidad de recesión puede superar a la de la luz sin violar la relatividad.`;},
          draw(c,w,h,t,v){const k=cosCalc(v),a=SIM_a(v,k);c.fillStyle='#02030a';c.fillRect(0,0,w,h*.74);const cx=w/2,cy=h*.37,sc=Math.min(w,h*.74)*.5/900;

                        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">

                                <!-- Center core -->
                                <circle cx="50" cy="50" r="2" fill="white" />

                                <circle cx="50" cy="50" r="10" stroke="rgba(59, 130, 246, 0.5)" class="cosmic-circle animate-expand" />
                                <circle cx="50" cy="50" r="10" stroke="rgba(147, 51, 234, 0.4)" class="cosmic-circle animate-expand delay-1" />
                                <circle cx="50" cy="50" r="10" stroke="rgba(30, 58, 138, 0.3)" class="cosmic-circle animate-expand delay-2" />

                            </h4>

                </div>
                ${adPlaceholder()}
            </div>
            `;
        }

        // 3. LIFE
        function renderLife() {

            return `

        // 4. HUMANITY

        function renderInventions() {

        // 6. CONNECTIONS
        function renderConnections() {
            return `
            <div class="max-w-6xl mx-auto px-4 py-10">
                ${sectionHeading("Conexiones Ocultas", "Artículos virales sobre vínculos inesperados.")}

                    ${connectionArticles.map(art => `
                        <div class="group relative overflow-hidden rounded-2xl aspect-[3/4] cursor-pointer bg-slate-900">
                            <img src="${imgFor(art.id)}" alt="" loading="lazy" onerror="this.remove()" class="absolute inset-0 w-full h-full object-cover opacity-70 group-hover:scale-105 transition-transform duration-700"><div class="absolute inset-0 bg-gradient-to-br ${art.color} opacity-20 group-hover:opacity-30 transition-opacity"></div>
                            <div class="absolute inset-0 p-8 flex flex-col justify-end bg-gradient-to-t from-slate-950 via-slate-900/60 to-transparent">

                                </div>

                                <p class="text-slate-300 text-sm opacity-0 group-hover:opacity-100 transform translate-y-4 group-hover:translate-y-0 transition-all duration-300">

                            </div>

                <div class="mt-16 bg-slate-900 p-8 rounded-xl border border-slate-800 text-center">
                    <h3 class="text-xl font-bold mb-4 text-white">¿Te ha volado la cabeza?</h3>
                    <p class="text-slate-400 mb-6">Suscríbete para recibir una conexión asombrosa cada semana.</p>
                    <div class="flex max-w-md mx-auto gap-2">
                        <input type="email" placeholder="Tu correo electrónico" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-amber-500" />
                        <button class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-6 py-2 rounded-lg transition-colors">Enviar</button>
                    </div>
                </div>
            </div>
            `;
        }

        // 7. FUTURE
        function renderFuture() {
            return `
            <div class="max-w-4xl mx-auto px-4 py-10">
                ${sectionHeading("El Futuro", "Escenarios plausibles basados en ciencia.")}
                <div class="space-y-12">
                    <div class="flex flex-col md:flex-row gap-8 items-center">
                        <div class="flex-1">
                            <h3 class="text-2xl font-bold mb-3 text-red-400">Marte 2100</h3>
                            <p class="text-slate-400 mb-4">
                                ¿Seremos una especie multiplanetaria? Los retos biológicos y técnicos de colonizar el Planeta Rojo son inmensos, pero necesarios si queremos asegurar la supervivencia a largo plazo de la consciencia.
                            </p>
                            <div class="h-2 w-full bg-slate-800 rounded-full overflow-hidden">

                            </div>
                            <span class="text-xs text-slate-500 mt-1 block">Probabilidad estimada: 25%</span>
                        </div>
                        <div class="w-full md:w-1/3 aspect-square bg-gradient-to-br from-red-900 to-black rounded-full flex items-center justify-center border-4 border-red-900/20 shadow-[0_0_50px_rgba(220,38,38,0.2)]">
                            <i data-lucide="rocket" size="48" class="text-red-500"></i>
                        </div>
                    </div>

                    <div class="flex flex-col md:flex-row-reverse gap-8 items-center">
                        <div class="flex-1">
                            <h3 class="text-2xl font-bold mb-3 text-cyan-400">Post-Humanidad</h3>
                            <p class="text-slate-400 mb-4">
                                La evolución biológica es lenta. La tecnológica es exponencial. ¿Nos fusionaremos con nuestras máquinas? La interfaz cerebro-computadora podría ser el siguiente gran salto evolutivo.
                            </p>
                            <div class="h-2 w-full bg-slate-800 rounded-full overflow-hidden">
                                <div class="h-full bg-cyan-500 w-3/4"></div>
                            </div>
                            <span class="text-xs text-slate-500 mt-1 block">Probabilidad estimada: 75%</span>
                        </div>
                        <div class="w-full md:w-1/3 aspect-square bg-gradient-to-br from-cyan-900 to-black rounded-full flex items-center justify-center border-4 border-cyan-900/20 shadow-[0_0_50px_rgba(8,145,178,0.2)]">
                            <i data-lucide="brain" size="48" class="text-cyan-500"></i>
                        </div>
                    </div>
                </div>
                ${adPlaceholder()}
            </div>
            `;
        }

        // 8. EXPLORE
        function renderExplore() {
            const resources = [
                { title: "Sapiens: De animales a dioses", author: "Yuval Noah Harari", type: "Libro" },
                { title: "Cosmos", author: "Carl Sagan", type: "Libro / Serie" },
                { title: "Kurzgesagt - In a Nutshell", author: "YouTube Channel", type: "Canal Educativo" },
                { title: "El Gen Egoísta", author: "Richard Dawkins", type: "Libro" }
            ];

            return `
            <div class="max-w-4xl mx-auto px-4 py-10">
                ${sectionHeading("Recursos y Exploración", "Profundiza en el conocimiento.")}
                
                <div class="grid md:grid-cols-2 gap-8 mb-12">
                    <div class="bg-slate-800/40 p-6 rounded-xl border border-slate-700 hover:border-amber-500/50 transition-colors">
                        <h3 class="text-xl font-bold mb-4 flex items-center gap-2 text-slate-100">
                            <i data-lucide="book-open" class="text-amber-500"></i> Lecturas Recomendadas
                        </h3>

                        </ul>
                        <p class="text-xs text-slate-500 mt-4 italic">* Enlaces de afiliados apoyan este proyecto.</p>
                    </div>

                    <div class="space-y-6">
                        <div class="bg-gradient-to-r from-amber-600 to-orange-600 p-6 rounded-xl text-white shadow-lg">
                            <h3 class="text-xl font-bold mb-2">Descarga la Infografía</h3>
                            <p class="text-sm opacity-90 mb-4">"El Árbol de los Inventos" en alta resolución. Ideal para imprimir.</p>
                            <button class="bg-white text-orange-600 text-sm font-bold py-2 px-4 rounded shadow hover:bg-slate-100 transition-colors w-full">
                                Descargar PDF (Gratis)
                            </button>
                        </div>

                        <div class="bg-slate-800/40 p-6 rounded-xl border border-slate-700 text-center">
                            <h3 class="text-xl font-bold mb-2 text-slate-100">Quiz Cósmico</h3>
                            <p class="text-sm text-slate-400 mb-4">¿En qué momento de la historia del universo encaja tu personalidad?</p>
                            <button class="border border-slate-500 text-slate-300 hover:border-amber-500 hover:text-amber-500 text-sm font-bold py-2 px-4 rounded w-full transition-colors">
                                Hacer el Quiz
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            `;
        }

        // --- MODAL LOGIC ---
        function openModalById(id, type) {
            let item;
            if(type === 'timeline') item = timelineData.find(d => d.id == id);
            else if(type === 'universe') item = universeArticles.find(d => d.id == id);
            else if(type === 'life') item = lifeArticles.find(d => d.id == id);
            else if(type === 'humanity') item = humanityArticles.find(d => d.id == id);
            
            if(item) openModal(item);
        }

        function openModal(item) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            
            // Populate Data
            const mi=document.getElementById('modal-image');mi.className='relative h-72 md:h-96 w-full bg-slate-800 bg-cover bg-center flex items-end';mi.style.backgroundImage=`linear-gradient(to top,rgba(15,23,42,1) 5%,rgba(15,23,42,.55) 50%,rgba(15,23,42,.15)),url('${imgFor(item.id||item.title)}')`;
            mi.innerHTML=`<div class="p-6 md:p-12 w-full"><div class="inline-flex items-center gap-2 text-[11px] md:text-xs uppercase tracking-[.2em] font-bold text-amber-300 bg-black/50 backdrop-blur rounded-full px-3 py-1.5 mb-4"><i data-lucide="${item.icon||'sparkles'}" size="14"></i>${item.year||item.tag||'EraOne'}</div><h2 class="text-3xl md:text-5xl font-bold text-white leading-tight max-w-3xl">${item.title}</h2></div>`;
            
            let metaHTML = '';
            if(item.year) {
                metaHTML = `<i data-lucide="${item.icon}"></i> <span>${item.year}</span>`;
            } else if (item.tag) {
                metaHTML = `<i data-lucide="${item.icon}"></i> <span>${item.tag}</span>`;
            }
            document.getElementById('modal-meta').innerHTML = metaHTML;
            const mt=document.getElementById('modal-title');mt.innerText=item.title;mt.className='text-3xl md:text-4xl font-bold text-white mb-4 leading-tight';
            const sents=item.fullContent.match(/[^.!?]+[.!?]+["»”)]?\s*/g)||[item.fullContent],paras=[];for(let i=0;i<sents.length;i+=2)paras.push(sents.slice(i,i+2).join('').trim());
            const exs=item.extra||EXTRA[item.id]||[],ex=exs.map((x,i)=>`<div class="pt-8 mt-4 border-t border-white/10"><div class="flex items-center gap-3 mb-3"><span class="font-mono text-sm text-amber-400">${String(i+1).padStart(2,'0')}</span><h3 class="text-2xl md:text-3xl font-bold text-white leading-tight">${x[0]}</h3></div><p>${x[1]}</p></div>`).join('');const mb=document.getElementById('modal-body');mb.className='space-y-6 text-slate-300 text-base md:text-lg leading-relaxed max-w-3xl mx-auto';
            mb.innerHTML=paras.map((p,i)=>`<p class="${i===0?'text-xl md:text-2xl text-slate-100 font-medium leading-snug border-l-4 border-amber-400 pl-5':''}">${p}</p>`).join('')+ex+`<div class="mt-8 pt-6 border-t border-white/10 flex flex-wrap items-center justify-between gap-3 text-sm text-slate-400"><span class="flex items-center gap-2"><i data-lucide="clock" size="14"></i>${Math.max(1,Math.round((item.fullContent+' '+exs.map(x=>x[1]).join(' ')).split(' ').length/200))} min de lectura</span><button onclick="closeModal();switchSection('simulations')" class="text-cyan-300 font-bold hover:text-cyan-200">Probar una simulación →</button></div>`;

            // Show
            overlay.classList.remove('hidden');
            // Small delay to allow transition
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);

            // Re-render icons inside modal
            lucide.createIcons();
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');

            overlay.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');

            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        }
    </script>
</body>
